services:
  browserless:
    image: browserless/chrome:latest
    ports:
      - "3000:3000"
    environment:
      - DISPLAY=host.docker.internal:0
      - DEBUG=browserless*
      - MAX_CONCURRENT_SESSIONS=10
      - CONNECTION_TIMEOUT=600000
      - MAX_QUEUE_LENGTH=10
      - PREBOOT_CHROME=true
      - ENABLE_DEBUGGER=false
      - WORKSPACE_DELETE_EXPIRED=true
      - DEFAULT_BLOCK_ADS=false
      - DEFAULT_HEADLESS=true
      - DEFAULT_IGNORE_HTTPS_ERRORS=true
      - CHROME_ARGS=--disable-blink-features=AutomationControlled --disable-features=IsolateOrigins,site-per-process --disable-setuid-sandbox --no-sandbox --disable-dev-shm-usage --disable-web-security --allow-running-insecure-content
    restart: unless-stopped
    shm_size: '2gb'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - hltv-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  hltv-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - TWOCAPTCHA_API_KEY=APIKEY
      - HLTV_BROWSERLESS_URL=ws://browserless:3000
      - PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
    depends_on:
      browserless:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hltv-network

networks:
  hltv-network:
    driver: bridge